include_patterns:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.jsx"
  - "**/*.mjs"
  - "**/*.cjs"
  - "**/*.json"
  - "**/*.sql"
  - "**/*.py"
  - "**/*.sh"
  - "**/*.md"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.css"

exclude_patterns:
  - "**/.*"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/coverage/**"
