# ══════════════════════════════════════════════════════════════════════════════
# Arch Systems — Production Docker Compose Configuration
#
# Full-stack single-host production deployment:
#   nginx reverse proxy, Next.js portal, ops-gateway, Redis, FUXA SCADA.
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file apps/portal/.env.production up -d
#
# Note: the legacy `api` service is intentionally omitted. The monorepo only
# has portal + ops-gateway applications; the API surface lives inside the
# Next.js App Router.
#
# ══════════════════════════════════════════════════════════════════════════════

name: arch-systems-production

services:
  # ── Reverse Proxy (Nginx) ───────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: devops/nginx/Dockerfile
    container_name: arch-nginx-prod
    restart: always
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PORTAL_HOST: portal:3000
      FUXA_HOST: fuxa:1881
    depends_on:
      portal:
        condition: service_healthy
      fuxa:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Frontend (Next.js Portal) ────────────────────────────────────────────────
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      target: runner
      args:
        NODE_ENV: production
    container_name: arch-portal-prod
    restart: always
    expose:
      - '3000'
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Arch Systems}
      NEXT_PUBLIC_FUXA_URL: ${NEXT_PUBLIC_FUXA_URL:-/scada}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arch-net-prod

  # ── Control Plane (Ops-Gateway / MCP) ────────────────────────────────────────
  ops-gateway:
    build:
      context: .
      dockerfile: apps/ops-gateway/Dockerfile
      target: production
    container_name: arch-ops-gateway-prod
    restart: always
    expose:
      - '3100'
    environment:
      OPS_API_URL: http://portal:3000/api/ops
      OPS_SECRET: ${INTERNAL_API_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MCP_PORT: 3100
      MCP_HOST: 0.0.0.0
      NODE_ENV: production
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      portal:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arch-redis-prod
    restart: always
    expose:
      - '6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── FUXA SCADA ───────────────────────────────────────────────────────────────
  fuxa:
    image: frangoteam/fuxa:latest
    container_name: arch-fuxa-prod
    restart: always
    expose:
      - '1881'
    environment:
      NODE_ENV: production
      FUXA_UI_PORT: 1881
      FUXA_UI_HOST: 0.0.0.0
    volumes:
      - fuxa_data:/usr/src/app/_appdata
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:1881/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  arch-net-prod:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-arch-prod

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  fuxa_data:
