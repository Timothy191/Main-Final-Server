# ══════════════════════════════════════════════════════════════════════════════
# Arch Systems — Production Docker Compose Configuration
#
# Full-stack single-host production deployment:
#   nginx reverse proxy, Next.js portal, Redis, FUXA SCADA, observability stack.
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file apps/portal/.env.production up -d
#
# Note: the API surface lives inside the Next.js App Router (apps/portal).
#
# ══════════════════════════════════════════════════════════════════════════════

name: arch-systems-production

services:
  # ── Reverse Proxy (Nginx) ───────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: devops/nginx/Dockerfile
    container_name: arch-nginx-prod
    restart: always
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PORTAL_HOST: portal:3000
      FUXA_HOST: fuxa:1881
    depends_on:
      portal:
        condition: service_healthy
      fuxa:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Frontend (Next.js Portal) ────────────────────────────────────────────────
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      target: runner
      args:
        NODE_ENV: production
    container_name: arch-portal-prod
    restart: always
    expose:
      - '3000'
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Arch Systems}
      NEXT_PUBLIC_FUXA_URL: ${NEXT_PUBLIC_FUXA_URL:-/scada}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arch-net-prod

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arch-redis-prod
    restart: always
    expose:
      - '6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Alertmanager ──────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: arch-alertmanager-prod
    restart: always
    expose:
      - '9093'
    environment:
      SLACK_API_URL: ${SLACK_API_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost:25}
      SMTP_FROM: ${SMTP_FROM:-alertmanager@archsystems.local}
      ALERTMANAGER_LOG_LEVEL: ${ALERTMANAGER_LOG_LEVEL:-info}
    volumes:
      # Mount the config template (with ${VAR} placeholders) and entrypoint script
      - ./ops/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml.tmpl:ro
      - ./ops/alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yaml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: arch-prometheus-prod
    restart: always
    expose:
      - '9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: arch-grafana-prod
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_INSTALL_PLUGINS: ""
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLE: "false"
      GF_FEATURE_TOGGLES_ENABLE: "alertingSimplifiedRouting flappingDetection"
    volumes:
      - grafana_data:/var/lib/grafana
      # Dashboard provider config
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Datasource provisioning
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Alert notification channel provisioning
      - ./ops/grafana/provisioning/notifiers:/etc/grafana/provisioning/notifiers:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_healthy
    networks:
      - arch-net-prod

  # ── FUXA SCADA ───────────────────────────────────────────────────────────────
  fuxa:
    image: frangoteam/fuxa:v1.1.13
    container_name: arch-fuxa-prod
    restart: always
    expose:
      - '1881'
    environment:
      NODE_ENV: production
      FUXA_UI_PORT: 1881
      FUXA_UI_HOST: 0.0.0.0
    volumes:
      - fuxa_data:/usr/src/app/_appdata
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:1881/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - arch-net-prod

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  arch-net-prod:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-arch-prod

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  fuxa_data:
  alertmanager_data:
  prometheus_data:
  grafana_data:
