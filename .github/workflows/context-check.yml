name: Context-Efficiency Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  context-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install

      - name: Run context-efficiency checks
        run: ./scripts/check_context.sh