name: Monorepo CI

# AGENT-TRACE: init-monorepo — affected-diff CI skeleton using
#   `turbo run ... --filter=...[origin/main]` so only changed packages
#   are rebuilt/validated on each PR.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected tasks
        run: pnpm turbo run lint type-check test build --filter=...[origin/main]

  rust:
    name: Rust workspace (arch-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # AGENT-TRACE: init-monorepo — Step 8 "Wire Rust / Tauri Workspaces" keeps
    # the Rust dev-engine validated on every push/PR so `scripts/dev.sh` and
    # `scripts/start-prod.sh` can't silently ship a broken ops-babysitter.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo check (workspace)
        run: |
          cd arch-engine
          cargo check --workspace

      - name: Cargo test (workspace)
        run: |
          cd arch-engine
          cargo test --workspace

      - name: Cargo fmt (workspace)
        run: |
          cd arch-engine
          cargo fmt --check --all || echo "::warning::rustfmt formatting differs; run 'cargo fmt' in arch-engine/"
