name: Redis Module CI

on:
  push:
    paths:
      - 'redis/**'
  pull_request:
    paths:
      - 'redis/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: |
          cd redis
          npm install
          cd modules/redis-facil
          make clean all
          pytest test_*.py
          cd ../tests
          ./run_e2e.sh
      - name: Audit
        run: |
          cd redis
          npm audit

  audit-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Coverage
        run: |
          pip install pytest-cov coverage
          cd redis/modules/redis-facil
          make -j4
          cp redis-facil.so ../..
          cd ..
          pytest --cov=redis_facil test/facil_*_test.py --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: redisfacil/test-*coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Redis Docker Image
        run: |
          docker build -t redis-facil -f redis/Dockerfile --build-arg MODULE_PATH=/usr/lib/redis-facil.so .