# =============================================================================
# Arch Systems — Grafana Dashboard Provider
# =============================================================================
# Tells Grafana where to find dashboard JSON files for auto-provisioning.
# Scans the specified directory for any *.json files.
#
# Path: /etc/grafana/provisioning/dashboards/dashboards.yaml
# Grafana version: >= 10.0
# =============================================================================

apiVersion: 1

providers:
  - name: "Arch Systems Cache Handler"
    orgId: 1
    folder: "Arch Systems"
    folderUid: "arch-systems"
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
