# =============================================================================
# Arch Systems — Grafana Datasource: Prometheus
# =============================================================================
# Provisioning file for Grafana to connect to the internal Prometheus instance.
#
# Path: /etc/grafana/provisioning/datasources/prometheus.yaml
# Grafana version: >= 10.0
# =============================================================================

apiVersion: 1

datasources:
  - name: "Prometheus"
    type: "prometheus"
    uid: "arch-prometheus"
    orgId: 1
    isDefault: true
    access: "proxy"
    url: "http://prometheus:9090"
    editable: false
    jsonData:
      timeInterval: "30s"
      queryTimeout: "30s"
      httpMethod: "POST"
      prometheusType: "Prometheus"
      prometheusVersion: "2.45.0"
      cacheLevel: "High"
      incrementalQueryOverlapWindow: "10m"
      manageAlerts: true
      alertmanagerUid: "arch-alertmanager"
      exemplarTraceIdDestinations: []
