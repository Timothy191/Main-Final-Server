packages:
  - "apps/*"
  - "packages/*"
  - "packages/departments/*"

# Hoisting and peer dependency settings (migrated from .npmrc to avoid npm warnings)
shamefully-hoist: true
strict-peer-dependencies: false
auto-install-peers: true
public-hoist-pattern:
  - "*eslint*"

# Security & stability settings (aligned with Next.js monorepo conventions)
updateNotifier: false
blockExoticSubdeps: true
minimumReleaseAge: 2880 # 48 hrs — avoid untested dependency drift
minimumReleaseAgeExclude:
  - '@repo/*'
  - next
  - react
  - react-dom
ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp

# AGENT-TRACE: init-monorepo — catalog centralizes shared dev-tool versions
# to reduce duplication and drift across 16 workspace packages.
catalog:
  typescript: "^5.7.0"
  zod: "^3.24.0"
  eslint: "^8.57.0"
  '@typescript-eslint/eslint-plugin': "^8.0.0"
  '@typescript-eslint/parser': "^8.0.0"
  '@types/react': "^19"
  '@types/react-dom': "^19"
  react: "^19.0.0"
  react-dom: "^19.0.0"
  prettier: "^3.9.6"
